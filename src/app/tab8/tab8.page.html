<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Média</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">




  <ion-list>

    <ion-item>
      <ion-input type="number" [(ngModel)]="nota1" label="Nota 1" labelPlacement="stacked" placeholder="Inserir nota"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="number" [(ngModel)]="nota2" label="Nota 2" labelPlacement="stacked" placeholder="Inserir nota"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="number"  [(ngModel)]="nota3" label="Nota 3" labelPlacement="stacked" placeholder="Inserir nota"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="number" [(ngModel)]="nota4" label="Nota 4" labelPlacement="stacked" placeholder="Inserir nota"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label>Média: {{result}}</ion-label>
    </ion-item>

    <ion-item>
      <ion-label color={{cor}}>Situação: {{situ}}</ion-label>
    </ion-item>

  </ion-list>

  <ion-button (click)="media()" expand="block">Calcular</ion-button>

</ion-content>
